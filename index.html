<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive algorithm visualizer — explore sorting, searching, graph, pathfinding, and data structure algorithms with step-by-step animations." />
  <title>Algorithm Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
            <rect x="2" y="22" width="4" height="8" rx="1" fill="var(--accent)" opacity="0.5"/>
            <rect x="8" y="16" width="4" height="14" rx="1" fill="var(--accent)" opacity="0.65"/>
            <rect x="14" y="10" width="4" height="20" rx="1" fill="var(--accent)" opacity="0.8"/>
            <rect x="20" y="6" width="4" height="24" rx="1" fill="var(--accent)" opacity="0.9"/>
            <rect x="26" y="2" width="4" height="28" rx="1" fill="var(--accent)"/>
          </svg>
          <h1 class="logo-text">AlgoVis</h1>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span>Toggle Theme</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Header / Control Bar -->
      <header id="control-bar" class="control-bar">
        <div class="control-bar-left">
          <div id="breadcrumb" class="breadcrumb">
            <span class="breadcrumb-category">Sorting</span>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-algo">Bubble Sort</span>
          </div>
        </div>
        <div class="control-bar-center">
          <button id="btn-reset" class="ctrl-btn" title="Reset (R)" aria-label="Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
          <button id="btn-play" class="ctrl-btn ctrl-btn-primary" title="Play / Pause (Space)" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button id="btn-step" class="ctrl-btn" title="Step Forward (→)" aria-label="Step">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <div class="ctrl-divider"></div>
          <div class="ctrl-slider-group">
            <label for="speed-slider">Speed</label>
            <input type="range" id="speed-slider" min="1" max="100" value="50" />
            <span id="speed-value" class="slider-value">50</span>
          </div>
          <div class="ctrl-slider-group">
            <label for="size-slider">Size</label>
            <input type="range" id="size-slider" min="5" max="150" value="50" />
            <span id="size-value" class="slider-value">50</span>
          </div>
          <button id="btn-generate" class="ctrl-btn" title="Generate New Data (G)" aria-label="Generate new data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          </button>
        </div>
        <div class="control-bar-right">
          <button id="btn-info-toggle" class="ctrl-btn" title="Toggle Info Panel (I)" aria-label="Toggle info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
          <button id="btn-code-toggle" class="ctrl-btn" title="Toggle Code Panel (C)" aria-label="Toggle code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
      </header>

      <!-- Visualization Area -->
      <div id="vis-container" class="vis-container">
        <div id="vis-canvas" class="vis-canvas"></div>

        <!-- Info Panel (right side) -->
        <aside id="info-panel" class="info-panel">
          <div class="panel-header">
            <h3>Algorithm Info</h3>
            <button id="info-close" class="panel-close" aria-label="Close info panel">&times;</button>
          </div>
          <div id="info-content" class="panel-body"></div>
        </aside>
      </div>

      <!-- Code Panel (bottom) -->
      <div id="code-panel" class="code-panel">
        <div class="panel-header">
          <h3>Pseudocode</h3>
          <button id="code-close" class="panel-close" aria-label="Close code panel">&times;</button>
        </div>
        <pre id="code-content" class="code-content"></pre>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
